<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <style>
      .prime-white { fill: #FFFFFF; }
      .prime-text-main { font-family: 'Syne', 'Montserrat', 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 64px; letter-spacing: 4px; }
      .prime-text-sub { font-family: 'Syne', 'Montserrat', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 24px; }
    </style>
  </defs>

  <g transform="translate(325, 20)">
    <!-- Architectural Frame & Skyline Icon in Pure White -->
    <path class="prime-white" d="M0,30 L95,30 L95,105 L100,105 L100,30 L185,30 L185,45 L155,45 L155,140 L160,140 L160,70 L185,70 L185,280 L0,280 L0,30 Z M35,100 L45,100 L45,230 L35,230 Z M80,130 L90,130 L90,260 L80,260 Z" />

    <!-- Center & Right Angular High-Rise Facade -->
    <path class="prime-white" d="M185,45 L250,0 L350,85 L350,335 L250,265 L185,280 Z" />
    
    <!-- Cutouts & Slits in the Tower -->
    <g fill="#000000" opacity="0.95">
      <polygon points="255,45 265,52 265,245 255,240" />
      <polygon points="275,70 283,76 283,250 275,245" />
      <polygon points="295,95 303,101 303,260 295,255" />
      <polygon points="315,118 322,123 322,275 315,270" />
      <polygon points="332,138 338,142 338,290 332,286" />

      <polygon points="205,90 215,95 215,255 205,257" />
      <polygon points="225,80 233,85 233,250 225,252" />
    </g>
  </g>

  <!-- Typography in Pure White -->
  <text x="500" y="440" text-anchor="middle" class="prime-white prime-text-main">PRIME CONSTRUCTIONS</text>
  <text x="512" y="505" text-anchor="middle" class="prime-white prime-text-sub">AND INTERIORS</text>
</svg>
